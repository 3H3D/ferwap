<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferwap Music Entertainment</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Ferwap Music",
  "url": "https://ferwap.com",
  "sameAs": [
    "URL_MUSICBRAINZ_FERWAP",
    "URL_WIKIDATA_FERWAP"
  ]
}
</script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- TOP NAVIGATION -->
    <header class="absolute top-0 left-0 right-0 z-50 px-6 md:px-12 py-6 flex items-center justify-between bg-gradient-to-b from-black/90 via-black/50 to-transparent">
        <!-- Logo / Brand -->
        <a href="#" class="flex items-center gap-3">
            <div class="w-8 h-8 bg-white text-black rounded-lg flex items-center justify-center font-bold text-sm">W</div>
            <span class="font-extrabold tracking-widest uppercase text-sm">Ferwap Music</span>
        </a>

        <!-- Menu Navigasi Atas -->
        <nav class="hidden md:flex items-center gap-8 text-xs font-semibold tracking-wider uppercase text-zinc-300">
            <a href="#" class="hover:text-white transition">About</a>
            <a href="#" class="hover:text-white transition">News</a>
            <a href="#" class="hover:text-white transition">Artists</a>
            <a href="#" class="hover:text-white transition">FAQ</a>
            <a href="#" class="hover:text-white transition">For Artists</a>
        </nav>
    </header>

    <!-- MAIN HERO SLIDER SECTION -->
    <main class="relative w-full h-screen flex items-center justify-center overflow-hidden">
        
        <!-- Background Banner / Artist Featured Image -->
        <div class="absolute inset-0 z-0">
            <img id="banner-image" src="3H3D.jpeg" alt="Featured Artist" class="w-full h-full object-cover filter brightness-75 transition-all duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/60"></div>
        </div>

        <!-- Tombol Navigasi Kiri -->
        <button id="prev-slide" class="absolute left-4 md:left-8 z-20 text-white/70 hover:text-white text-3xl md:text-5xl p-4 transition focus:outline-none">
            <i class="fa-solid fa-angle-left"></i>
        </button>

        <!-- Konten / Teks di Tengah Layar (Sudah Disusun Rapi agar tidak tertutup atas) -->
        <main class="relative z-10 text-center space-y-4 px-6 max-w-3xl pt-16">
            <p id="artist-subtitle" class="text-[11px] md:text-sm uppercase tracking-[0.3em] text-white font-semibold drop-shadow-md">Featured Artist &bull; Independent Singer Songwriter</p>
            <h1 id="artist-name" class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white drop-shadow-xl">3H3D</h1>
            <div class="pt-4">
                <a id="artist-link" href="https://3h3dofficial.web.id" target="_blank" class="inline-block px-8 py-3.5 bg-white text-black font-bold rounded-full text-xs uppercase tracking-widest hover:bg-zinc-200 transition shadow-2xl">Explore Artist</a>
            </div>
        </main>

        <!-- Tombol Navigasi Kanan -->
        <button id="next-slide" class="absolute right-4 md:right-8 z-20 text-white/70 hover:text-white text-3xl md:text-5xl p-4 transition focus:outline-none">
            <i class="fa-solid fa-angle-right"></i>
        </button>

        <!-- Titik Indikator Slider (Pagination Dots di Bawah Banner) -->
        <div class="absolute bottom-8 z-20 flex items-center justify-center gap-3">
            <span class="dot w-2.5 h-2.5 rounded-full bg-red-600 transition-all cursor-pointer" onclick="currentSlide(1)"></span>
            <span class="dot w-2.5 h-2.5 rounded-full bg-white/40 transition-all cursor-pointer" onclick="currentSlide(2)"></span>
            <span class="dot w-2.5 h-2.5 rounded-full bg-white/40 transition-all cursor-pointer" onclick="currentSlide(3)"></span>
        </div>
    </main>

    <!-- SECTION BAWAH: LABELS / ROSTER LOGOS -->
    <section class="bg-white text-black py-20 px-8">
        <div class="max-w-6xl mx-auto space-y-12">
            <h2 class="text-3xl md:text-4xl font-bold tracking-tight">Labels & Roster</h2>
            
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-8 items-center opacity-80">
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl hover:shadow-lg transition">
                    <span class="font-bold tracking-widest text-sm">FERWAP</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl hover:shadow-lg transition">
                    <span class="font-bold tracking-widest text-sm">3H3D</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl hover:shadow-lg transition">
                    <span class="font-bold tracking-widest text-sm">ANDER</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl hover:shadow-lg transition">
                    <span class="font-bold tracking-widest text-sm">COLUMBIA</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl hover:shadow-lg transition">
                    <span class="font-bold tracking-widest text-sm">EPIC</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl hover:shadow-lg transition">
                    <span class="font-bold tracking-widest text-sm">AUDIO LAB</span>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-black text-zinc-500 py-8 px-8 text-center text-xs space-y-2 border-t border-zinc-900">
        <p>&copy; 2026 Ferwap Music Entertainment. All Rights Reserved.</p>
        <div class="flex justify-center gap-6 text-zinc-400">
            <a href="#" class="hover:text-white transition">Privacy Policy</a>
            <a href="#" class="hover:text-white transition">Terms of Service</a>
            <a href="#" class="hover:text-white transition">Contact</a>
        </div>
    </footer>

    <!-- SCRIPT SLIDER -->
    <script>
        const slides = [
            {
                name: "3H3D",
                subtitle: "Featured Artist &bull; Independent Singer Songwriter",
                image: "3H3D.jpeg",
                link: "https://3h3dofficial.web.id"
            },
            {
                name: "ANDER",
                subtitle: "Roster Artist &bull; Pop / Reggae",
                image: "ANDER.jpg",
                link: "#"
            },
            {
                name: "FERWAP MUSIC",
                subtitle: "Independent Record Label &bull; Audio Production House",
                image: "3H3D.jpeg",
                link: "#"
            }
        ];

        let currentIndex = 0;
        const nameEl = document.getElementById('artist-name');
        const subEl = document.getElementById('artist-subtitle');
        const linkEl = document.getElementById('artist-link');
        const bannerImg = document.getElementById('banner-image');

        function updateSlide(index) {
            nameEl.innerHTML = slides[index].name;
            subEl.innerHTML = slides[index].subtitle;
            linkEl.href = slides[index].link;
            bannerImg.src = slides[index].image;
            
            document.querySelectorAll('.dot').forEach((dot, idx) => {
                if(idx === index) {
                    dot.classList.remove('bg-white/40');
                    dot.classList.add('bg-red-600');
                } else {
                    dot.classList.remove('bg-red-600');
                    dot.classList.add('bg-white/40');
                }
            });
        }

        document.getElementById('next-slide').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % slides.length;
            updateSlide(currentIndex);
        });

        document.getElementById('prev-slide').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            updateSlide(currentIndex);
        });

        function currentSlide(n) {
            currentIndex = n - 1;
            updateSlide(currentIndex);
        }
    </script>
</body>
</html>
