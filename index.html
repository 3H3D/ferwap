<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferwap - Official Website</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
    <script src="js/cookie.js"></script>
<body>

    <!-- Top Header Bar (Logo SONY di Kanan Atas) -->
    <header class="top-header">
        <div class="brand-top-right">
            <span class="sony-logo">Ferwap</span>
        </div>
    </header>

<!-- Hero Main Section -->
        <section class="hero-container">
            <!-- Header Navigasi & Logo Bersanding dalam Satu Baris -->
            <nav class="main-nav">
                <!-- Logo Ferwap Music diletakkan di sebelah kiri About -->
                <div class="brand-group-left">
                <a href="index.html" style="display: flex; flex-direction: column; align-items: center; text-decoration: none;">
                    <img src="Ferwap.jpeg" alt="Ferwap Music Logo" style="height: 90px; width: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #ff0000;">
                    <span class="sub-brand-text" style="color: #fff; font-weight: bold; letter-spacing: 1px; margin-top: 5px; font-size: 0.85rem;">FERWAP MUSIC</span>
                </a>
            </div>

                <!-- Menu Navigasi -->
                <div class="dropdown">
                    <a href="#" class="drop-btn">About <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 4px;"></i></a>
                    <div class="dropdown-content">
                        <a href="artists.html">Featured Artists</a>
                        <a href="#">Labels & Creative Divisions</a>
                        <a href="#">Executives</a>
                        <a href="#">Contacts</a>
                        <a href="#">Diversity, Equity & Inclusion</a>
                        <a href="#">Giving Back</a>
                    </div>
                </div>
                <a href="#">News</a>
                <a href="artists.html">Artists</a>
                <a href="#">FAQ</a>
            </nav>

            <!-- Slide Content (Gambar & Teks Artist di Tengah) -->
            <div class="slide-content">
                <button class="slider-arrow arrow-left" id="prevBtn">&#10094;</button>
                <div class="artist-label-text">3H3D</div>
                <div class="hero-image-box">
                    <a href="https://3h3dofficial.web.id" target="_blank">
                        <img src="3H3D.jpeg" alt="3H3D" class="hero-img">
                    </a>
                    <div class="hero-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <button class="slider-arrow arrow-right" id="nextBtn">&#10095;</button>
            </div>

    <!-- Footer Section -->
    <footer class="site-footer">
        <div class="social-icons">
            <a href="https://www.facebook.com/ferwapmusic" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/ferwapmusic" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="ferwapmusic.info@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <p class="copyright">&copy; 2026 Ferwap Music Entertainment. All Rights Reserved.</p>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a> | 
            <a href="terms.html">Terms of Service</a> | 
            <a href="copyright.html">Copyright</a>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
