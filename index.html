<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferwap - Official Website</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Header Bar -->
    <header class="top-header">
        <div class="brand-top-right">
            <span class="sony-logo">FERWAP</span>
        </div>
    </header>

    <!-- Hero Main Section -->
    <section class="hero-container">
        <!-- Overlay Navigation & Logo Kiri Atas -->
        <div class="hero-overlay-nav">
            <div class="brand-group-left">
                <div class="red-dot-grid-logo">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
                <span class="sub-brand-text">FERWAP MUSIC</span>
            </div>
            <!-- Menu Navigasi Disesuaikan -->
            <nav class="main-nav">
                <a href="#">About</a>
                <a href="#">News</a>
                <a href="#">Artists</a>
                <a href="#">FAQ</a>
            </nav>
        </div>

        <!-- Slider Arrow Left -->
        <button class="slider-arrow arrow-left" id="prevBtn" aria-label="Previous">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Main Slide Content -->
        <div class="slide-content">
            <div class="artist-label-text">3H3D</div>
            <div class="hero-image-box">
                <!-- Ganti path foto artis sesuai file kamu -->
                <img src="assets/images/artist-3h3d.jpg" alt="3H3D" class="hero-img" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80'">
                
                <!-- Hero Dots -->
                <div class="hero-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>

        <!-- Slider Arrow Right -->
        <button class="slider-arrow arrow-right" id="nextBtn" aria-label="Next">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </section>

    <!-- Labels Section (White Background) -->
    <section class="labels-section">
        <h2 class="labels-title">Labels</h2>
        <div class="labels-grid">
            <div class="label-item">ALAMO RECORDS</div>
            <div class="label-item">ARISTA</div>
            <div class="label-item">AWAL</div>
            <div class="label-item border-box">COLUMBIA</div>
            <div class="label-item cursive">Epic</div>
            <div class="label-item">FERWAP MUSIC</div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="site-footer">
        <div class="social-icons">
            <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <p class="copyright">&copy; 2026 Ferwap Music Entertainment. All Rights Reserved.</p>
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a> | 
            <a href="terms.html">Terms of Service</a> | 
            <a href="copyright.html">Copyright</a>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
