<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferwap Music Entertainment</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between">

    <!-- TOP NAVIGATION -->
    <header class="w-full absolute top-0 left-0 z-50 px-4 md:px-12 py-5 flex items-center justify-between bg-gradient-to-b from-black/90 via-black/50 to-transparent">
        <a href="#" class="flex items-center gap-2 md:gap-3">
            <div class="w-7 h-7 md:w-8 md:h-8 bg-white text-black rounded-lg flex items-center justify-center font-bold text-xs md:text-sm">W</div>
            <span class="font-extrabold tracking-widest uppercase text-xs md:text-sm">Ferwap Music</span>
        </a>
        <nav class="flex items-center gap-3 sm:gap-6 md:gap-8 text-[10px] sm:text-xs font-semibold tracking-wider uppercase text-zinc-300">
            <a href="#" class="hover:text-white transition">About</a>
            <a href="#" class="hover:text-white transition">News</a>
            <a href="#" class="hover:text-white transition">Artists</a>
            <a href="#" class="hover:text-white transition">FAQ</a>
            <a href="#" class="hover:text-white transition hidden sm:inline-block">For Artists</a>
        </nav>
    </header>

    <!-- MAIN HERO SLIDER -->
    <main class="relative w-full h-screen flex items-center justify-center overflow-hidden">
        
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img id="banner-image" src="3H3D.jpeg" alt="Featured Artist" class="w-full h-full object-cover filter brightness-75">
            <div class="absolute inset-0 bg-black/50"></div>
        </div>

        <!-- Tombol Kiri -->
        <button id="prev-slide" class="absolute left-2 md:left-8 z-20 text-white/80 hover:text-white text-3xl md:text-5xl p-4 focus:outline-none transition">
            <i class="fa-solid fa-angle-left"></i>
        </button>

        <!-- Konten Teks di Tengah -->
        <div class="relative z-10 text-center space-y-4 px-6 max-w-2xl mx-auto pt-16">
            <p id="artist-subtitle" class="text-[10px] sm:text-xs md:text-sm uppercase tracking-[0.3em] text-white font-bold drop-shadow-md">Featured Artist &bull; Independent Singer Songwriter</p>
            <h1 id="artist-name" class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight text-white drop-shadow-xl">3H3D</h1>
            <div class="pt-4">
                <a id="artist-link" href="https://3h3dofficial.web.id" target="_blank" class="inline-block px-7 py-3 bg-white text-black font-bold rounded-full text-[11px] md:text-xs uppercase tracking-widest hover:bg-zinc-200 transition shadow-xl">Explore Artist</a>
            </div>
        </div>

        <!-- Tombol Kanan -->
        <button id="next-slide" class="absolute right-2 md:right-8 z-20 text-white/80 hover:text-white text-3xl md:text-5xl p-4 focus:outline-none transition">
            <i class="fa-solid fa-angle-right"></i>
        </button>

        <!-- Titik Indikator -->
        <div class="absolute bottom-8 z-20 flex items-center justify-center gap-3">
            <span class="dot w-2.5 h-2.5 rounded-full bg-red-600 transition-all cursor-pointer" onclick="currentSlide(1)"></span>
            <span class="dot w-2.5 h-2.5 rounded-full bg-white/40 transition-all cursor-pointer" onclick="currentSlide(2)"></span>
            <span class="dot w-2.5 h-2.5 rounded-full bg-white/40 transition-all cursor-pointer" onclick="currentSlide(3)"></span>
        </div>
    </main>

    <!-- SECTION BAWAH: LABELS -->
    <section class="bg-white text-black py-16 px-6 md:px-12">
        <div class="max-w-6xl mx-auto space-y-8 text-center md:text-left">
            <h2 class="text-2xl md:text-3xl font-bold tracking-tight">Labels & Roster</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 items-center">
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl">
                    <span class="font-bold tracking-widest text-xs">FERWAP</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl">
                    <span class="font-bold tracking-widest text-xs">3H3D</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl">
                    <span class="font-bold tracking-widest text-xs">ANDER</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl">
                    <span class="font-bold tracking-widest text-xs">COLUMBIA</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl">
                    <span class="font-bold tracking-widest text-xs">EPIC</span>
                </div>
                <div class="flex justify-center p-4 border border-zinc-200 rounded-xl">
                    <span class="font-bold tracking-widest text-xs">AUDIO LAB</span>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-black text-zinc-500 py-6 px-6 text-center text-xs space-y-3 border-t border-zinc-900">
        <p>&copy; 2026 Ferwap Music Entertainment. All Rights Reserved.</p>
        <div class="flex justify-center gap-6 text-zinc-400">
            <a href="#" class="hover:text-white transition">Privacy Policy</a>
            <a href="#" class="hover:text-white transition">Terms of Service</a>
        </div>
    </footer>

    <!-- SCRIPT SLIDER -->
    <script>
        const slides = [
            {
                name: "3H3D",
                subtitle: "Featured Artist &bull; Independent Singer Songwriter",
                image: "3H3D.jpeg",
                link: "https://3h3dofficial.web.id"
            },
            {
                name: "ANDER",
                subtitle: "Roster Artist &bull; Pop / Reggae",
                image: "ANDER.jpg",
                link: "#"
            },
            {
                name: "FERWAP MUSIC",
                subtitle: "Independent Record Label &bull; Audio Production House",
                image: "3H3D.jpeg",
                link: "#"
            }
        ];

        let currentIndex = 0;
        const nameEl = document.getElementById('artist-name');
        const subEl = document.getElementById('artist-subtitle');
        const linkEl = document.getElementById('artist-link');
        const bannerImg = document.getElementById('banner-image');

        function updateSlide(index) {
            nameEl.innerHTML = slides[index].name;
            subEl.innerHTML = slides[index].subtitle;
            linkEl.href = slides[index].link;
            bannerImg.src = slides[index].image;
            
            document.querySelectorAll('.dot').forEach((dot, idx) => {
                if(idx === index) {
                    dot.classList.remove('bg-white/40');
                    dot.classList.add('bg-red-600');
                } else {
                    dot.classList.remove('bg-red-600');
                    dot.classList.add('bg-white/40');
                }
            });
        }

        document.getElementById('next-slide').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % slides.length;
            updateSlide(currentIndex);
        });

        document.getElementById('prev-slide').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            updateSlide(currentIndex);
        });

        function currentSlide(n) {
            currentIndex = n - 1;
            updateSlide(currentIndex);
        }
    </script>
</body>
</html>
