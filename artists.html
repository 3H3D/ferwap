<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Artists - Ferwap Music</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Gaya Khusus Halaman Artists ala Sony Music */
        body {
            background-color: #fff; /* Latar belakang bersih/putih */
            color: #111;
        }

        .artists-section {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .artists-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .artists-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #111;
            margin-bottom: 10px;
        }

        /* Grid Kartu Artis */
        .artists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .artist-card {
            background-color: #fff;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .artist-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .artist-card-img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
        }

        /* Kotak Merah di Bawah Foto ala Label Besar */
        .artist-card-info {
            background-color: #cc0000; /* Warna merah khas label */
            color: #fff;
            padding: 18px 15px;
            text-align: center;
        }

        .artist-card-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .artist-card-sub {
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Header Navigasi -->
    <header class="main-header">
        <div class="brand-group-left">
            <div class="red-dot-grid-logo">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <span class="sub-brand-text">FERWAP MUSIC</span>
        </div>

        <nav>
            <div class="dropdown">
                <a href="index.html" class="drop-btn">About <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 4px;"></i></a>
                <div class="dropdown-content">
                    <a href="artists.html">Featured Artists</a>
                    <a href="index.html#labels">Labels & Creative Divisions</a>
                    <a href="#">Executives</a>
                    <a href="#">Contacts</a>
                </div>
            </div>
            <a href="#">News</a>
            <a href="artists.html" class="active">Artists</a>
            <a href="#">FAQ</a>
        </nav>
    </header>

    <!-- Konten Utama Halaman Featured Artists -->
    <main class="artists-section">
        <div class="artists-header">
            <h1>Featured Artists</h1>
        </div>

        <div class="artists-grid">
            
            <!-- Artis 1: 3H3D -->
            <a href="https://3h3dofficial.web.id" target="_blank" class="artist-card">
                <img src="3H3D.jpeg" alt="3H3D" class="artist-card-img">
                <div class="artist-card-info">
                    <div class="artist-card-name">3H3D</div>
                    <div class="artist-card-sub">3H3D Official Site</div>
                </div>
            </a>

            <!-- Artis 2: ANDER -->
            <a href="https://3h3dofficial.web.id" target="_blank" class="artist-card">
                <img src="ANDER.jpeg" alt="ANDER" class="artist-card-img">
                <div class="artist-card-info">
                    <div class="artist-card-name">ANDER</div>
                    <div class="artist-card-sub">ANDER Official Site</div>
                </div>
            </a>

            <!-- Artis 3: Ferrson -->
            <a href="https://3h3dofficial.web.id" target="_blank" class="artist-card">
                <img src="Ferrson.F.jpeg" alt="Ferrson" class="artist-card-img">
                <div class="artist-card-info">
                    <div class="artist-card-name">Ferrson</div>
                    <div class="artist-card-sub">Ferrson Official Site</div>
                </div>
            </a>

        </div>
    </main>

</body>
</html>
